name: Thrice-Daily Neo Aozora Sci-Fi Reboot to WordPress

on:
  # Thrice-daily scheduled runs:
  # 1) 朝の通勤前: 21:30 UTC = 06:30 JST (通勤前に届くよう朝6時半に配信)
  # 2) 夕方の通勤前: 08:30 UTC = 17:30 JST (帰宅通勤前に届くよう夕方5時半に配信)
  # 3) 夜寝る前: 13:30 UTC = 22:30 JST (就寝前のリラックスタイム夜10時半に配信)
  schedule:
    - cron: '30 8,13,21 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (Simulate without sending email or committing history)'
        required: true
        type: boolean
        default: false
      post_status:
        description: 'Post status on WordPress (publish or draft)'
        required: true
        type: choice
        options:
          - publish
          - draft
        default: 'publish'
      repost:
        description: 'Re-post a recreated story (No.1: 音楽浴, No.2: 蠅男, No.3: 人造人間事件, No.4: 振動魔, No.5: 植物人間, or reset_all)'
        required: false
        type: choice
        options:
          - none
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - reset_all
        default: 'none'
      force:
        description: 'Force run (even if already published)'
        required: false
        type: boolean
        default: false
      work_id:
        description: 'Specific Aozora work ID (optional, e.g. unno-vibration-demon)'
        required: false
        type: string
        default: ''
      ending_theme:
        description: 'Ending theme (random [3:2:3:2], bright, dystopia, romance, mystery)'
        required: false
        type: choice
        options:
          - random
          - bright
          - dystopia
          - romance
          - mystery
        default: 'random'

permissions:
  contents: write

jobs:
  daily-publish:
    name: Generate & Dispatch Sci-Fi Post via Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Execute Daily Generation and WordPress Mail Dispatch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-2.5-flash' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          DEFAULT_POST_STATUS: ${{ github.event.inputs.post_status || 'publish' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_WORK_ID: ${{ github.event.inputs.work_id }}
          INPUT_REPOST: ${{ github.event.inputs.repost }}
          INPUT_ENDING_THEME: ${{ github.event.inputs.ending_theme }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --send"
          fi

          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "$INPUT_REPOST" = "reset_all" ]; then
            ARGS="$ARGS --repost all"
          elif [ -n "$INPUT_REPOST" ] && [ "$INPUT_REPOST" != "none" ]; then
            ARGS="$ARGS --repost $INPUT_REPOST"
          elif [ -n "$INPUT_WORK_ID" ]; then
            ARGS="$ARGS --work-id $INPUT_WORK_ID"
          fi

          if [ -n "$INPUT_ENDING_THEME" ] && [ "$INPUT_ENDING_THEME" != "random" ]; then
            ARGS="$ARGS --ending $INPUT_ENDING_THEME"
          fi

          if [ -n "${{ github.event.inputs.post_status }}" ]; then
            ARGS="$ARGS --status ${{ github.event.inputs.post_status }}"
          fi

          echo "Running: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: Upload HTML Preview Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-preview-html
          path: preview_output.html
          if-no-files-found: ignore

      - name: Commit & Push Updated History and Generated Content
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/POSTED_STORIES.md content/ archive/
          if git diff --staged --quiet; then
            echo "No state or content updates to commit."
          else
            git commit -m "chore: Auto-update posted stories history and content [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
